# Include inside the HTTPS moving.marknpost.com server block.
# The auth service is loopback-only and validates the password before the
# static journal HTML is returned. The login document contains no journal data.
location = /_log_auth/check {
    internal;
    proxy_pass http://127.0.0.1:8767/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_send_timeout 2s;
    access_log off;
}

location = /_log_auth/login {
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8767/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
    access_log off;
}

location = /log {
    auth_basic off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 301 /log/;
}

location = /log/login.html {
    auth_basic off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location /log/ {
    auth_basic off;
    auth_request /_log_auth/check;
    error_page 401 = /log/login.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
}
