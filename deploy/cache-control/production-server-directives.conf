# Include in the HTTPS moving.marknpost.com server block.
# HTML is revalidated. Versioned CSS and JS are immutable for one year.
# Unversioned CSS and JS are revalidated. Images and fonts are cached for one week.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

add_header Cache-Control "no-cache" always;

# Publish only the two reviewed Markdown page summaries. Other .md files stay closed.
location = /georgia-russia/index.md {
    default_type text/markdown;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location = /balkans/index.md {
    default_type text/markdown;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location ~* ^/(?!log/).*\.(?:css|js)$ {
    set $mnp_asset_cache "no-cache";
    if ($arg_v != "") {
        set $mnp_asset_cache "public, max-age=31536000, immutable";
    }
    add_header Cache-Control $mnp_asset_cache always;
    add_header X-Content-Type-Options nosniff always;
}

location ~* ^/(?!log/).*\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf)$ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
}
