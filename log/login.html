<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Закрытый журнал Mark’n’Post</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f6f8; color: #181818; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #d8dde2; border-radius: 8px; background: #fff; box-shadow: 0 18px 50px rgba(17, 17, 17, .12); }
      img { display: block; width: 54px; height: 54px; margin-bottom: 24px; }
      h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.1; }
      p { margin: 0 0 22px; color: #626262; font-size: 16px; line-height: 1.5; }
      label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
      input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #aeb8c2; border-radius: 6px; color: #181818; font: inherit; }
      input:focus-visible, button:focus-visible { outline: 3px solid rgba(44, 164, 198, .35); outline-offset: 2px; }
      button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 6px; background: #e30613; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #b9000b; }
      .error { min-height: 22px; margin: 10px 0 0; color: #b9000b; font-size: 14px; }
      @media (max-width: 480px) { main { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/marknpost-logo.svg" alt="Mark’n’Post" width="54" height="54" />
      <h1>Закрытый журнал</h1>
      <p>Введи пароль, чтобы открыть журнал версий Mark’n’Post.</p>
      <form id="log-login" autocomplete="on">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" inputmode="numeric" required autofocus />
        <button type="submit">Открыть журнал</button>
        <p class="error" id="error" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.getElementById("log-login");
      const password = document.getElementById("password");
      const error = document.getElementById("error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        const button = form.querySelector("button");
        button.disabled = true;
        try {
          const response = await fetch("/_log_auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: password.value })
          });
          if (response.ok) {
            window.location.assign("/log/");
            return;
          }
          error.textContent = response.status === 429
            ? "Слишком много попыток. Попробуй позже."
            : "Неверный пароль. Проверь ввод и попробуй ещё раз.";
          password.select();
        } catch (_error) {
          error.textContent = "Не удалось проверить пароль. Обнови страницу и попробуй ещё раз.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
